[package]
name = "sp-process"
description = "Minecraft server process manager and the Java runtime manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
sp-core.workspace = true
sp-net.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures.workspace = true
regex.workspace = true
walkdir.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
semver.workspace = true
sysinfo.workspace = true
async-trait.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
# Needed only for Job Objects so no orphaned javaw.exe survives a panel crash.
# `unsafe_code` is allowed in the one function that calls into Win32; see
# src/job_object.rs, which documents every call.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
tempfile = "3"
