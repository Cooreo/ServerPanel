# group3 test+msrv

# Everything below is deliberately gated on files that may not exist yet: the
# frontend jobs light up the moment web/package.json lands, without anyone editing
# this file. A job that cannot possibly pass is worse than no job.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Spigot build tests and Adoptium downloads must never be flaky on network.
  NET: offline

jobs:
  test:
    name: Test (${{ matrix.os) }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            args: --workspace --all-features --no-fail-fast
          # Windows is the primary target: the Job Object code path only exists
          # there, and so does the path/ACL behaviour the file manager relies on.
          - os: windows-latest
            args: --workspace --no-fail-fast
          - os: macos-latest
            args: --workspace --no-fail-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Unit + integration tests
        run: cargo test ${{ matrix.args }}
      - name: Doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --workspace

  # The workspace must stay buildable at the declared MSRV, because distro
  # toolchains (and the Windows installer's users) lag behind stable.

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets
