name: CI

# Everything below is deliberately gated on files that may not exist yet: the
# frontend jobs light up the moment web/package.json lands, without anyone editing
# this file. A job that cannot possibly pass is worse than no job.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Spigot build tests and Adoptium downloads must never be flaky on network.
  NET: offline

jobs:
  # GitHub restricts the job-level `if` context to `github`, `needs`, `vars` and
  # `inputs` — the `hashFiles()` function is only legal in a *step's* `if`. Using it on
  # a job makes the entire workflow fail to parse, and the symptom is the worst kind:
  # the run appears, completes in 0s with zero jobs, zero billed seconds and no log.
  # So the "does this component exist yet" probes live in one cheap job and the
  # optional jobs gate on its outputs. Same effect, and it is debuggable.
  detect:
    name: Detect optional components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.probe.outputs.web }}
      e2e: ${{ steps.probe.outputs.e2e }}
      docker: ${{ steps.probe.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          {
            if [ -f web/package.json ]; then echo "web=true"; else echo "web=false"; fi
            if [ -f web/package.json ] && [ -f web/playwright.config.ts ]; then
              echo "e2e=true"
            else
              echo "e2e=false"
            fi
            if [ -f Dockerfile ]; then echo "docker=true"; else echo "docker=false"; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  rustfmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # -D warnings is a hard requirement: a warning today is a bug next month.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic -A clippy::module_name_repetitions -A clippy::missing_errors_doc -A clippy::needless_pass_by_value -A clippy::too_many_lines

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            args: --workspace --all-features --no-fail-fast
          # Windows is the primary target: the Job Object code path only exists
          # there, and so does the path/ACL behaviour the file manager relies on.
          - os: windows-latest
            args: --workspace --no-fail-fast
          - os: macos-latest
            args: --workspace --no-fail-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Unit + integration tests
        run: cargo test ${{ matrix.args }}
      - name: Doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --workspace

  # The workspace must stay buildable at the declared MSRV, because distro
  # toolchains (and the Windows installer's users) lag behind stable.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets

  web:
    name: Web UI
    needs: [detect]
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [detect]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build the panel binary
        run: cargo build --release -p sp-server
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: web
        run: npx playwright test
        env:
          CI: "true"

  docker:
    name: Docker image
    needs: [detect]
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          push: false
          tags: serverpanel:ci
