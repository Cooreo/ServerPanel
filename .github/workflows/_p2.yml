# group2 fmt+clippy

# Everything below is deliberately gated on files that may not exist yet: the
# frontend jobs light up the moment web/package.json lands, without anyone editing
# this file. A job that cannot possibly pass is worse than no job.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Spigot build tests and Adoptium downloads must never be flaky on network.
  NET: offline

jobs:
  rustfmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # -D warnings is a hard requirement: a warning today is a bug next month.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic -A clippy::module_name_repetitions -A clippy::missing_errors_doc -A clippy::needless_pass_by_value -A clippy::too_many_lines
