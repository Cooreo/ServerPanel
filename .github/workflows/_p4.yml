# group4 web/e2e/docker needs-detect-inline

# Everything below is deliberately gated on files that may not exist yet: the
# frontend jobs light up the moment web/package.json lands, without anyone editing
# this file. A job that cannot possibly pass is worse than no job.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Spigot build tests and Adoptium downloads must never be flaky on network.
  NET: offline

jobs:
  detect:
    name: Detect optional components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.probe.outputs.web }}
      e2e: ${{ steps.probe.outputs.e2e }}
      docker: ${{ steps.probe.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          {
            if [ -f web/package.json ]; then echo "web=true"; else echo "web=false"; fi
            if [ -f web/package.json ] && [ -f web/playwright.config.ts ]; then
              echo "e2e=true"
            else
              echo "e2e=false"
            fi
            if [ -f Dockerfile ]; then echo "docker=true"; else echo "docker=false"; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  web:
    name: Web UI
    needs: [detect]
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [detect]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build the panel binary
        run: cargo build --release -p sp-server
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: web
        run: npx playwright test
        env:
          CI: "true"

  docker:
    name: Docker image
    needs: [detect]
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          push: false
          tags: serverpanel:ci
