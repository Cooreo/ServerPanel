# group1 header+detect

# Everything below is deliberately gated on files that may not exist yet: the
# frontend jobs light up the moment web/package.json lands, without anyone editing
# this file. A job that cannot possibly pass is worse than no job.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Spigot build tests and Adoptium downloads must never be flaky on network.
  NET: offline

jobs:
  detect:
    name: Detect optional components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.probe.outputs.web }}
      e2e: ${{ steps.probe.outputs.e2e }}
      docker: ${{ steps.probe.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          {
            if [ -f web/package.json ]; then echo "web=true"; else echo "web=false"; fi
            if [ -f web/package.json ] && [ -f web/playwright.config.ts ]; then
              echo "e2e=true"
            else
              echo "e2e=false"
            fi
            if [ -f Dockerfile ]; then echo "docker=true"; else echo "docker=false"; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
