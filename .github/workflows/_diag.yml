# TEMPORARY — delete when ci.yml is green. Not a gate; it relays cargo's own output
# to issue #2, because this sandbox cannot reach
# results-receiver.actions.githubusercontent.com and `gh run view --log` therefore
# fails even when a job ran. Pass/fail logic stays in ci.yml.
name: diag
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  DIAG_ISSUE: "2"
jobs:
  diag:
    name: Relay cargo output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag
      - name: rustfmt
        run: |
          cargo fmt --all > fmt.log 2>&1
          echo "fmt fix exit: $?" >> fmt.log
          cargo fmt --all -- --check >> fmt.log 2>&1
          echo "fmt check exit: $?" >> fmt.log
          git checkout -- .
      - name: cargo check
        run: |
          set +e
          cargo check --workspace --all-targets --message-format short > check.log 2>&1
          echo "check exit: $?" >> check.log
      - name: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format short \
            -- -D warnings -D clippy::pedantic \
               -A clippy::module_name_repetitions -A clippy::missing_errors_doc \
               -A clippy::needless_pass_by_value -A clippy::too_many_lines \
            > clippy.log 2>&1
          echo "clippy exit: $?" >> clippy.log
      - name: tidy
        run: |
          # Cargo prints its own "unused workspace dependency" notes for path deps whose
          # crates are not written yet (sp-server, sp-desktop). They are noise on every
          # run, they are ANSI-heavy, and they pushed the real failure off the end of a
          # fixed-size relay. Strip colour and drop that one lint here, once, for all logs.
          for f in fmt.log check.log clippy.log; do
            sed -r 's/\x1b\[[0-9;]*m//g; s/\x1b\[[0-9;]*[A-Za-z]//g' "$f" > "$f.clean"
            grep -v "unused workspace dependency" "$f.clean" | grep -v "^ *[0-9]* *|" | grep -v "^ *|" | grep -v "consider removing the workspace dependency" | grep -v "is set to .warn. by default" | grep -v "^ *-->" > "$f.filt" || true
            mv "$f.filt" "$f.clean"
            echo "== $f: $(wc -l < "$f.clean") lines"
          done
      - name: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### \`$(git rev-parse --short HEAD)\` — run ${GITHUB_RUN_ID}"
            echo ""
            echo "| step | result |"
            echo "| --- | --- |"
            echo "| rustfmt | $(grep -c '^Diff in' fmt.log.clean) diff hunks |"
            echo "| check | $(grep -cE 'error' check.log.clean) error lines, $(grep -cE 'warning' check.log.clean) warnings |"
            echo "| clippy | $(grep -cE 'error' clippy.log.clean) error lines, $(grep -cE 'warning' clippy.log.clean) warnings |"
            echo ""
            echo "**exits:** $(grep -h 'exit:' fmt.log check.log clippy.log | tr '\n' ' ')"
            echo ""
            echo '```text'
            grep -E 'error' check.log.clean | head -60
            echo "--- full resolution/conflict text ---"
            grep -A40 'failed to select\|error\[' check.log.clean | head -120
            echo '```'
            echo ""
            echo '```text'
            grep -E 'warning' clippy.log.clean | grep -v '^ *$' | head -60
            echo '```'
            echo ""
            echo "<details><summary>raw tails (catches failures with no file:line)</summary>"
            echo ""
            echo '```text'
            tail -c 5500 check.log.clean
            echo '--- clippy ---'
            tail -c 3000 clippy.log.clean
            echo '```'
            echo ""
            echo "</details>"
          } > body.md
          python3 -c "
          t = open('body.md').read()
          if len(t) > 62000:
              open('body.md','w').write(t[:62000] + '\n\n…truncated\n')
          "
          gh issue comment "$DIAG_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md
