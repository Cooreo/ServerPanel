# TEMPORARY — delete when ci.yml is green. Not a gate; it relays cargo's own output
# to issue #2, because this sandbox cannot reach
# results-receiver.actions.githubusercontent.com and `gh run view --log` fails even
# after a job ran. Pass/fail logic stays in ci.yml; this only moves text.
name: diag
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  DIAG_ISSUE: "2"
jobs:
  diag:
    name: Relay cargo output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag
      - name: rustfmt
        run: |
          # Every step here expects a non-zero exit on a red tree: the failure *is*
          # the payload, so `bash -e` must not abort the job on it. An earlier
          # revision died at `cargo fmt -- --check` returning 1 — the normal case —
          # and posted nothing.
          set +e
          cargo fmt --all > fmt.log 2>&1
          echo "fmt fix exit: $?" >> fmt.log
          cargo fmt --all -- --check > fmtcheck.log 2>&1
          echo "fmt check exit: $?" >> fmtcheck.log
          git checkout -- .
      - name: cargo check
        run: |
          set +e
          # --keep-going reports every crate instead of stopping at the first: without
          # it, a failure in sp-core hides the seven crates behind it and each round
          # trip to CI costs one crate's worth of errors.
          cargo check --workspace --all-targets --keep-going --message-format short > check.log 2>&1
          if grep -q "unexpected argument '--keep-going'" check.log; then
            echo "(--keep-going unsupported by this cargo; re-running without it)" > check.log
            cargo check --workspace --all-targets --message-format short >> check.log 2>&1
          fi
          echo "check exit: $?" >> check.log
      - name: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets --keep-going --message-format short \
            -- -D warnings -D clippy::pedantic \
               -A clippy::module_name_repetitions -A clippy::missing_errors_doc \
               -A clippy::needless_pass_by_value -A clippy::too_many_lines \
            > clippy.log 2>&1
          if grep -q "unexpected argument '--keep-going'" clippy.log; then
            cargo clippy --workspace --all-targets --message-format short \
              -- -D warnings > clippy.log 2>&1
          fi
          echo "clippy exit: $?" >> clippy.log
      - name: tidy
        run: |
          set +e
          # Cargo colour-codes everything, and it prints "unused workspace
          # dependency" notes for path deps whose crates are not written yet. Both
          # push the real diagnostics past a fixed-size relay, so colour is stripped
          # and that one note is dropped once, for all logs.
          #
          # `error` as a substring is also a trap: it matches `thiserror`, and a
          # relay full of "Downloaded thiserror v2.0.21" is how the first version of
          # this step reported "0 errors" for a red build. Diagnostics from
          # `--message-format short` are `path.rs:line:col: error[code]: text`, which
          # is what the greps below look for.
          for f in fmt.log fmtcheck.log check.log clippy.log; do
            sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$f" > "$f.clean"
            grep -v "unused workspace dependency" "$f.clean" | grep -v "^ *|" | grep -v "consider removing the workspace dependency" > "$f.filt" || true
            mv "$f.filt" "$f.clean"
          done
      - name: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # If the formatter below ever crashes, the fallback still posts the raw
          # grep output: a relay that fails silently is how a red build read as
          # "0 errors" once already.
          if ! python3 - <<'PY'
          import re, subprocess, os
          DIAG = os.environ["DIAG_ISSUE"]
          sha = subprocess.run(["git", "rev-parse", "--short", "HEAD"], capture_output=True, text=True).stdout.strip()

          def read(name):
              try:
                  return open(name, errors="replace").read()
              except FileNotFoundError:
                  return ""

          def diag(text):
              return [l for l in text.splitlines() if re.search(r"\.rs:\d+:\d+: (error|warning)", l)]

          check, clippy = read("check.log.clean"), read("clippy.log.clean")
          fmt, fmtcheck = read("fmt.log.clean"), read("fmtcheck.log.clean")
          cerr, cwarn = diag(check), diag(clippy)
          codes = {}
          for l in cerr + diag(clippy):
              # One search, not findall-with-tuples: `re.findall` over a pattern with
              # three groups returns 3-tuples, and indexing m[3] on a 3-tuple is an
              # IndexError — which killed this step and posted nothing for a build that
              # had plenty to say.
              m = re.search(r":\s(error|warning)(?:\[([^\]]+)\])?:", l)
              if m:
                  key = m.group(2) or "uncoded"
                  codes[key] = codes.get(key, 0) + 1
          by_crate = {}
          for l in cerr:
              m = re.match(r"(crates/[^/]+)", l)
              if m:
                  by_crate[m.group(1)] = by_crate.get(m.group(1), 0) + 1
          hunks = len(re.findall(r"^Diff in", fmtcheck, re.M))
          lines = []
          add = lines.append
          add(f"### `{sha}` — run {os.environ.get('GITHUB_RUN_ID','')}")
          add("")
          add("| step | result |")
          add("| --- | --- |")
          add(f"| rustfmt | {hunks} diff hunks |")
          add(f"| cargo check | {len(cerr)} errors |")
          add(f"| clippy | {len(diag(clippy))} diagnostics ({len(cwarn)} warnings) |")
          add("")
          add(f"**exits:** fmt {fmt.strip().splitlines()[-1] if fmt.strip() else 'n/a'} / {check.strip().splitlines()[-1] if check.strip() else 'n/a'} / {clippy.strip().splitlines()[-1] if clippy.strip() else 'n/a'}")
          add("")
          if by_crate:
              add("errors by crate: " + ", ".join(f"{k}={v}" for k, v in sorted(by_crate.items(), key=lambda kv: -kv[1])))
              add("")
          if codes:
              add("by kind: " + ", ".join(f"`{k}`x{v}" for k, v in sorted(codes.items(), key=lambda kv: -kv[1])))
              add("")
          body = ["\n".join(lines)]
          chunk = ""
          for l in cerr[:400]:
              if len(chunk) + len(l) + 1 > 58000:
                  body.append("```text\n" + chunk + "\n```")
                  chunk = ""
              chunk += l + "\n"
          if chunk:
              body.append("```text\n" + chunk + "\n```")
          if len(cerr) > 400:
              body.append(f"_(showing 400 of {len(cerr)} check errors; the rest are in the following comments)_")
          tail = check.strip().splitlines()[-25:]
          body.append("<details><summary>raw check tail</summary>\n\n```text\n" + "\n".join(tail) + "\n```\n\n</details>")
          if not cerr:
              # A build can fail with no file:line at all (manifest, resolver, a
              # panic in a build script). Without this, that reads as "clean".
              body.append("### raw logs (no file:line diagnostics found)\n\n```text\n" + "\n".join(check.strip().splitlines()[-60:]) + "\n```\n")
              body.append("```text\n" + "\n".join(clippy.strip().splitlines()[-40:]) + "\n```\n")
          for i, part in enumerate(body):
              part = part if len(part) <= 62000 else part[:62000] + "\n…truncated\n"
              path = f"body-{i}.md"
              open(path, "w").write(part)
              subprocess.run(["gh", "issue", "comment", DIAG, "--repo", os.environ["GITHUB_REPOSITORY"], "--body-file", path], check=False)
          print(f"posted {len(body)} comment(s); {len(cerr)} errors relayed")
          PY
          then
            grep -E '\.rs:[0-9]+:[0-9]+: (error|warning)' check.log.clean | head -200 > fallback.md || true
            {
              echo "### relay script failed — raw diagnostics"
              echo ""
              echo '```text'
              cat fallback.md
              echo '```'
              echo ""
              echo '```text'
              tail -40 check.log.clean
              echo '```'
            } > fallback-body.md
            gh issue comment "$DIAG_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file fallback-body.md || true
          fi
